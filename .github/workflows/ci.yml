name: CI – Build, Test & Validate Migrations

on:
  push:
    branches: ["main", "develop", "feature/**"]
  pull_request:
    branches: ["main", "develop"]

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  # ── Job 1: Build e Testes ─────────────────────────────────
  build-and-test:
    name: Build & Test (.NET 8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore — Estoque.API
        run: dotnet restore Estoque.API/Estoque.API.csproj

      - name: Restore — Faturamento.API
        run: dotnet restore Faturamento.API/Faturamento.API.csproj

      - name: Restore — Estoque.Tests
        run: dotnet restore Estoque.Tests/Estoque.Tests.csproj

      - name: Restore — Faturamento.Tests
        run: dotnet restore Faturamento.Tests/Faturamento.Tests.csproj

      - name: Build — Estoque.API
        run: dotnet build Estoque.API/Estoque.API.csproj --no-restore -c Release

      - name: Build — Faturamento.API
        run: dotnet build Faturamento.API/Faturamento.API.csproj --no-restore -c Release

      - name: Test — Estoque
        run: dotnet test Estoque.Tests/Estoque.Tests.csproj --no-restore -c Release --verbosity normal

      - name: Test — Faturamento
        run: dotnet test Faturamento.Tests/Faturamento.Tests.csproj --no-restore -c Release --verbosity normal

  # ── Job 2: Validação de Migrations ────────────────────────
  validate-migrations:
    name: Validate EF Core Migrations
    runs-on: ubuntu-latest
    needs: build-and-test   # Só valida se o build passar

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install dotnet-ef tool
        run: dotnet tool install --global dotnet-ef

      - name: Restore — Estoque.API
        run: dotnet restore Estoque.API/Estoque.API.csproj

      - name: Restore — Faturamento.API
        run: dotnet restore Faturamento.API/Faturamento.API.csproj

      # Gera o script SQL idempotente da migration (--idempotent)
      # Valida que o modelo e a migration estão em sincronia
      - name: Validate Migration — Estoque
        run: |
          dotnet ef migrations script \
            --idempotent \
            --no-build \
            --project Estoque.API/Estoque.API.csproj \
            --output /tmp/migration-estoque.sql
          echo "✔ Migration Estoque gerada com sucesso"
          echo "Primeiras linhas do script:"
          head -20 /tmp/migration-estoque.sql

      - name: Validate Migration — Faturamento
        run: |
          dotnet ef migrations script \
            --idempotent \
            --no-build \
            --project Faturamento.API/Faturamento.API.csproj \
            --output /tmp/migration-faturamento.sql
          echo "✔ Migration Faturamento gerada com sucesso"
          echo "Primeiras linhas do script:"
          head -20 /tmp/migration-faturamento.sql

      # Upload dos scripts como artefatos para auditoria
      - name: Upload Migration Scripts
        uses: actions/upload-artifact@v4
        with:
          name: migration-scripts-${{ github.sha }}
          path: /tmp/migration-*.sql
          retention-days: 30

  # ── Job 3: Build Docker (apenas na main) ──────────────────
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: validate-migrations
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build — Estoque.API Docker image
        run: docker build -f Estoque.API/Dockerfile Estoque.API/ -t korp/estoque-api:ci

      - name: Build — Faturamento.API Docker image
        run: docker build -f Faturamento.API/Dockerfile Faturamento.API/ -t korp/faturamento-api:ci
